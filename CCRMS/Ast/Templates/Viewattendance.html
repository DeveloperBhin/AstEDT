{% load static %}
{% include "header.html" %}

<!DOCTYPE html>
<html lang="en">
<head>  
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doctor Attendance</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    .form-section-title {
      margin-top: 30px;
      margin-bottom: 15px;
      color: #155B7A;
      font-weight: bold;
      text-align: center;
    }

    .form-container {
      padding: 20px;
      margin: 20px auto;
      max-width: 900px;
      background-color: #f8f9fa;
      border-radius: 10px;
      box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
    }

    .form-label {
      font-weight: 600;
    }

    .btn-submit {
      background-color: #87ceeb;
      border-color: #87ceeb;
      font-size: large;
      font-weight: bold;
    }

    .form-control:hover {
      border-color: #007bff;
      box-shadow: 0px 0px 5px rgba(0, 123, 255, 0.5);
    }
  </style>
</head>

<body>

<div class="form-container">
  <h3 class="text-center text-primary">Doctor Attendance</h3>

  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}

    <!-- CHILDREN INFORMATION -->
    <div class="form-section-title">Children Information</div>
    
    <div class="row mb-3">
      <div class="col-md-4">
        <label class="form-label">First Name:</label>
        <input type="text" class="form-control" value="{{ patient.child_first_name }}" readonly>
        
      </div>
      <div class="col-md-4">
        <label class="form-label">Middle Name:</label>
        <input type="text" class="form-control" value="{{ patient.child_middle_name }}" readonly>
      </div>
      <div class="col-md-4">
        <label class="form-label">Last Name:</label>
        <input type="text" class="form-control" value="{{ patient.child_last_name }}" readonly>
      </div>
    </div>

    <div class="row mb-3">
      <div class="col-md-4">
        <label class="form-label">Gender:</label>
        <input type="text" class="form-control" value="{{ patient.gender }}" readonly>
      </div>
      <div class="col-md-4">
        <label class="form-label">Date of Birth:</label>
        <input type="text" class="form-control" value="{{ patient.dob }}" readonly>
      </div>
      <div class="col-md-4">
        <label class="form-label">Place of Birth:</label>
        <input type="text" class="form-control" value="{{ patient.pob }}" readonly>
      </div>
    </div>

    <div class="row mb-3">
      <div class="col-md-6">
        <label class="form-label">Height of Birth:</label>
        <input type="text" class="form-control" value="{{ patient.hob }}" readonly>
      </div>
      <div class="col-md-6">
        <label class="form-label">Weight of Birth:</label>
        <input type="text" class="form-control" value="{{ patient.lob }}" readonly>
      </div>
    </div>

    <!-- MOTHER INFORMATION -->
    <div class="form-section-title">Mother Information</div>
    <div class="row mb-3">
      <div class="col-md-4">
        <label class="form-label">First Name:</label>
        <input type="text" class="form-control" value="{{ patient.mother_first_name }}" readonly>
      </div>
      <div class="col-md-4">
        <label class="form-label">Middle Name:</label>
        <input type="text" class="form-control" value="{{ patient.mother_middle_name }}" readonly>
      </div>
      <div class="col-md-4">
        <label class="form-label">Last Name:</label>
        <input type="text" class="form-control" value="{{ patient.mother_last_name }}" readonly>
      </div>
    </div>

    <div class="row mb-4">
      <div class="col-md-6">
        <label class="form-label">Phone Number:</label>
        <input type="text" class="form-control" value="{{ patient.phone_number }}" readonly>
      </div>
      <div class="col-md-6">
        <input type="hidden" name="username" value="{{ patient.username }}" readonly>
      </div>
    </div>
 

    <!-- ACCOUNT INFORMATION (Editable Fields) -->
    <div class="form-section-title">Attendance Details</div>
    

    <div class="row mb-3">
      <div class="col-md-6">
        <label for="id_Date" class="form-label">Attendance:</label>
        
        <input type="text" name="username" value="{{ patient.Attendance }}" readonly>
      
      </div>
    
    </div>

    
    
   

  </form>
</div>

</body>
</html>
