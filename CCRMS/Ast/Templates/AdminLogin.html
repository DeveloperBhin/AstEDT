{% load static %}
{% include "header.html"%}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
   

</head>


<body>
  {% for message in messages %}
  <p>{{ message }}</p>
{% endfor %}


  <div class="row " style="margin-top:60px; align-items: center;" >
    <div class="row" style="padding: 10px; margin:10px;">
      <div class="news-ticker">
 </div>
    <div class="col-12 col-md-3 col-sm-2">
    </div>
    <div class="col-12 col-md-6 col-sm-6">
  <div class="container mt-7 my-30 text-center" > 
   <div class="card " style="padding:20px; margin:20px;  ">
    
         

      

  
    
      <!-- No error display for password1 -->
   
    <h3 class="text-center" style="color:#87ceeb ">Admin Login</h3>
    <form method="post" enctype="multipart/form-data" >
        {% csrf_token %}
        <div class="row mb-3 "style="margin-top: 5px;   padding: 10px; border-radius: 10px; width: 100%;" >
          <label for="id_fullname" class="form-label d-flex start">Username:</label>
            {{ Loginform.username }}
            
        </div>
        <div class="row mb-3 "style="margin-top: 5px;   padding: 10px; border-radius: 10px; width: 100%;" >
          <label for="id_course" class="form-label d-flex start">Password:</label>
            {{ Loginform.password}}
            
        </div>
       
        
   
          
        
         
          
          
          
        <div class="d-grid">
            <button type="submit" class="button" style="background-color: #87ceeb; border-radius: 5px; border-color:#87ceeb; font-size:x-large;">Login</button>
        </div>
        
    </form>

       
    
     
</div>
  </div>
    </div>
  </div>
</form>
</div>
</div>
  </div>
        
             
         
  

    <!-- Bootstrap Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>


</body>

</html>
